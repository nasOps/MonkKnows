services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      # Mount certificates symlinks (live/) and actual cert files (archive/) so nginx can read certificates
      - /etc/letsencrypt/live/monkknows.dk:/etc/letsencrypt/live/monkknows.dk
      - /etc/letsencrypt/archive/monkknows.dk:/etc/letsencrypt/archive/monkknows.dk
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - web
    restart: unless-stopped

  web:
    image: ghcr.io/nasops/monkknows:latest
    volumes:
      - /opt/whoknows/data/logging:/app/db/logging
    mem_limit: 256m
    cpus: 0.50
    environment:
      - RACK_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SESSION_SECRET=${SESSION_SECRET}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'net/http'; res = Net::HTTP.get_response(URI('http://localhost:4567/health')); exit(res.is_a?(Net::HTTPSuccess) ? 0 : 1)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s
    restart: unless-stopped