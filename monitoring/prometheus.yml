global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'monkknows'
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['monkknows.dk']
        labels:
          environment: 'production'

  # Host metrics from node_exporter on both VMs (port 9100)
  # VM2 is reached via host network on the same machine; VM1 via public IP
  # (Azure NSG must permit VM2 -> VM1:9100).
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          host: 'vm2'
          role: 'db-monitoring'
      - targets: ['4.225.161.111:9100']
        labels:
          host: 'vm1'
          role: 'app'

  # PostgreSQL health metrics via postgres_exporter sidecar.
  # Connection: host.docker.internal:5432 reaches the monkknows-db container
  # on the same VM2 host via the docker bridge gateway.
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels:
          host: 'vm2'
          role: 'db'
