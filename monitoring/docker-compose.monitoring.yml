services:
  prometheus:
    image: prom/prometheus:v2.53.4
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=90d'
    extra_hosts:
      # Required to reach node_exporter (host network mode) on the same VM
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_EXPORTER_USER:?POSTGRES_EXPORTER_USER required}:${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD required}@host.docker.internal:5432/monkknows?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9187:9187"
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.10

  node_exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    network_mode: host
    volumes:
      - /:/rootfs:ro,rslave
    command:
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.10

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?GRAFANA_USER required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

volumes:
  prometheus_data:
  grafana_data:
