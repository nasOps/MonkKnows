name: CD — Deploy Crawler (Azure Function)

on:
  push:
    branches: [main]
    paths:
      - azure-function/**
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --target=".python_packages/lib/site-packages" -r requirements.txt
        working-directory: azure-function

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@bc63708cc6539760eea18d8a7de4ce8ef5fdf593
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: azure-function
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
