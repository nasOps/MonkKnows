name: CI — Continuous Integration

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --- Fast quality gates (parallel) ---

  bundler-audit:
    name: Bundler Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ruby-sinatra

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ruby-sinatra

      - name: Install bundler-audit
        run: gem install bundler-audit

      - name: Run bundler-audit
        run: bundle audit check --update

  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ruby-sinatra

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ruby-sinatra

      - name: Install brakeman
        run: gem install brakeman

      - name: Run brakeman
        run: brakeman --no-pager --force

  lint-dockerfile:
    name: Hadolint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
        with:
          dockerfile: ruby-sinatra/Dockerfile

# Analyses source code and reports (metrics) to SonarCloud and Quality Gates in GitHub
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # --- Build & test (depends on all quality gates) ---

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    needs: [bundler-audit, brakeman, lint-dockerfile]

    defaults:
      run:
        working-directory: ruby-sinatra

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ruby-sinatra

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run tests
        run: bundle exec rspec

  # --- Smoke test (depends on build-test) ---

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Create .env file for CI
        run: |
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET || 'ci_test_secret_key_not_for_production_use_1234567890' }}" > ruby-sinatra/.env
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY || 'dummy_key_for_ci' }}" >> ruby-sinatra/.env
          echo "RACK_ENV=development" >> ruby-sinatra/.env

      - name: Start app with Docker Compose
        run: docker compose -f docker-compose.dev.yml up -d --build --wait

      - name: Run smoke test with cURL
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:4567/)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ CI Smoke test passed (status: $HTTP_STATUS)"
          else
            echo "❌ CI Smoke test failed (status: $HTTP_STATUS)"
            exit 1
          fi

      - name: Tear down app
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  # --- E2E tests (parallel, does not block fast feedback) ---

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Create .env file
        run: |
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET || 'ci_test_secret_key_not_for_production_use_1234567890' }}" > ruby-sinatra/.env
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY || 'dummy_key_for_ci' }}" >> ruby-sinatra/.env
          echo "RACK_ENV=e2e" >> ruby-sinatra/.env
          echo "DB_NAME=monkknows_e2e" >> ruby-sinatra/.env

      # Start db + web in one go: depends_on with service_healthy ensures
      # db is ready before web boots, and web's startup runs db:create + db:migrate.
      - name: Start app
        run: DB_NAME=monkknows_e2e docker compose -f docker-compose.dev.yml up -d --wait --build

      - name: Debug logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs web

      # No explicit reset step: compose's web startup already runs
      # rake db:create + db:migrate + migrate_to_tsvector against a
      # fresh pgdata volume on every CI run. db:drop here would fail
      # anyway because puma holds open connections to monkknows_e2e.

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd ruby-sinatra/spec/e2e
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: cd ruby-sinatra/spec/e2e && npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: ruby-sinatra/spec/e2e/playwright-report/

      - name: Tear down app
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v